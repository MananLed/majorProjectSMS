  DeleteRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: delete-requests-queue
      VisibilityTimeout: 250
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
            - 'DeleteRequestsDLQ'
            - 'Arn'
        maxReceiveCount: 3
      

  DeleteRequestsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: delete-requests-dlq 

  DeleteProfile:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x 
    Properties:
      CodeUri: ./cmd/aws-functions/delete_profile
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref UpKeepzTable
        - AmazonSQSFullAccess:
            QueueName: !Ref DeleteRequestsQueue
      Environment:
        Variables:
          QUEUE_URL: !Ref DeleteRequestsQueue
      Events:
        ApiEvent:
          Type: Api 
          Properties: 
            Method: delete
            Path: /profile
            RestApiId: !Ref Api   

  DeleteRequests: 
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x 
    Properties:
      CodeUri: ./cmd/aws-functions/delete_requests_of_resident
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref UpKeepzTable
      Events:
        SQSTrigger:
          Type: SQS 
          Properties:
            Queue: !GetAtt DeleteRequestsQueue.Arn

  InvoiceEmailTopic:
