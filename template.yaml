Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Architectures:
      - x86_64
    Timeout: 200
    Handler: bootstrap
    Runtime: provided.al2023

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Cors: 
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS,PATCH'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  Login:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/aws-functions/login
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: post 
            Path: /login 
            RestApiId: !Ref Api 

  Signup:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x 
    Properties:
      CodeUri: ./cmd/aws-functions/signup
      Events:
        ApiEvent:
          Type: Api 
          Properties: 
            Method: post 
            Path: /signup 
            RestApiId: !Ref Api

  Profile:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/aws-functions/profile
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: get 
            Path: /profile
            RestApiId: !Ref Api

  ViewResident:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/aws-functions/view_residents
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: get 
            Path: /society/residents
            RestApiId: !Ref Api

  ViewOfficers:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/aws-functions/view_officers
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: get 
            Path: /society/officers
            RestApiId: !Ref Api

  ViewNotices:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/aws-functions/view_all_notices
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: get 
            Path: /notices
            RestApiId: !Ref Api

  ViewNoticesMonthYear:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/aws-functions/view_notices_month_year
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: get 
            Path: /notices/month-year
            RestApiId: !Ref Api

  ViewInvoicesMonthYear:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/aws-functions/view_invoices_month_year
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: get 
            Path: /invoices/month-year
            RestApiId: !Ref Api

  DeleteOfficer:
    Type: AWS::Serverless::Function 
    Metadata: 
      BuildMethod: go1.x 
    Properties:
      CodeUri: ./cmd/aws-functions/delete_officer
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: delete 
            Path: /credentials/officer
            RestApiId: !Ref Api 

  DeleteResident:
    Type: AWS::Serverless::Function 
    Metadata: 
      BuildMethod: go1.x 
    Properties:
      CodeUri: ./cmd/aws-functions/delete_resident
      Events:
        ApiEvent:
          Type: Api 
          Properties:
            Method: delete 
            Path: /credentials/resident
            RestApiId: !Ref Api 

  IssueNotice:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x 
    Properties:
      CodeUri: ./cmd/aws-functions/issue_notice
      Events:
        ApiEvent:
          Type: Api 
          Properties: 
            Method: post 
            Path: /notices/issue
            RestApiId: !Ref Api

  IssueInvoice:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x 
    Properties:
      CodeUri: ./cmd/aws-functions/issue_invoice
      Events:
        ApiEvent:
          Type: Api 
          Properties: 
            Method: post 
            Path: /invoices/issue
            RestApiId: !Ref Api